      ${(r.awardsReviewed || []).length || (r.sources || []).length ? `<details><summary class="note">Awards and sources Claude reviewed</summary><ol style="font-size:12px">${[...(r.awardsReviewed || []), ...(r.sources || [])].map((x) => `<li>${safeUrl(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>` : esc(x.title || "")}${x.recipient ? ` · ${esc(x.recipient)}` : ""}</li>`).join("")}</ol></details>` : ""}
      <p class="note" style="margin-top:8px">AI-generated from public award abstracts and the solicitation. Full winning proposals aren't public. <button class="btn-ghost" data-coach="${esc(o.id)}" ${ro()} style="padding:1px 8px;font-size:12px">Refresh coaching</button></p>
    </section>`;
  }
  async function requestCoaching(oppId) {
    const o = OPPS.find((x) => x.id === oppId); if (!o || !db || !canWrite) return;
    try {
      await db.doc("coaching/" + oppId).set(await stamp({ oppId, title: o.title, status: "queued", requestedAt: new Date().toISOString() }));
      logChange({ kind: "decision", action: "requested proposal coaching for", targetId: oppId, targetName: o.title, changes: [] });
      runResearchNow();
    } catch (err) { alertInline(errMsg(err)); }
  }

  // ---------- web research (done by a scheduled Claude session with web search) ----------
  // The page can't reach the web, so it queues a request in the shared store; a scheduled
  // Claude Code session opens the link, searches online, and writes back a cited draft.
  const researchFor = (pid) => Object.entries(S.research).map(([id, r]) => ({ id, ...r })).filter((r) => r.partnerId === pid).sort((a, b) => String(b.requestedAt).localeCompare(String(a.requestedAt)))[0];
  async function queueResearch(pid, partner) {
    if (!db || !canWrite) return;
    const p = partner || S.partners[pid]; if (!p) return;
    const pending = researchFor(pid);
    if (pending && (pending.status === "queued" || pending.status === "working")) return setJob(pid, "Web research is already queued for this partner.");
    try {
      const ref = db.collection("research").doc();
      await ref.set(await stamp({ partnerId: pid, name: p.name, type: p.type || "", url: p.url || "", status: "queued", requestedAt: new Date().toISOString() }));
      logChange({ kind: "partner", action: "requested web research for", targetId: pid, targetName: p.name, changes: [] });
      setJob(pid, "Queued for web research. Results usually arrive within the hour.");
      runResearchNow();
    } catch (err) { setJob(pid, errMsg(err), true); }
  }
  // The page owner can start the research session right away; everyone else waits for the hourly run.
  async function runResearchNow() {
    const trig = S.settings.research?.triggerId;
    if (!trig || !user?.isOwner?.()) return;
    try {
      const mcp = await window.claude?.use?.("mcp"); if (!mcp) return;
      await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: trig, text: "Requested from the Partners tab." });
    } catch { /* the hourly run picks it up */ }
  }
  async function applyResearchSummary(rid) {
    const r = S.research[rid]; const prev = r && S.partners[r.partnerId]; if (!prev || !r.result?.summary) return;
    const body = await stamp({ ...prev, summary: r.result.summary });
    try {
      await db.doc("partners/" + r.partnerId).set(body);
      const changes = diff(prev, body, { summary: "Focus summary" });
      if (changes.length) logChange({ kind: "partner", action: "updated", targetId: r.partnerId, targetName: prev.name, changes });
      setJob(r.partnerId, "Summary replaced with the web research draft. Use Edit to change it.");
    } catch (err) { setJob(r.partnerId, errMsg(err), true); }
  }
  function researchHtml(p) {
    const r = researchFor(p.id);
    const btn = (label) => `<button class="btn-ghost" data-research="${esc(p.id)}" ${ro()} ${p.url ? "" : 'disabled title="Add a link first"'}>${label}</button>`;
    if (!r) return p.url ? `<div class="btns">${btn("Research online")}</div>` : "";
    if (r.status === "queued" || r.status === "working") {
      return `<div class="research"><div class="top"><b>Web research</b><span class="note">${r.status === "working" ? "Claude is researching now…" : `Queued ${fmtDate(r.requestedAt)}. Usually ready within the hour (weekdays, 7 AM–7 PM Central).`}</span></div></div>`;
    }
    if (r.status === "failed") {
      return `<div class="research"><div class="top"><b>Web research</b><span class="note">Couldn't finish: ${esc(r.error || "no reliable sources found")}</span></div><div class="btns">${btn("Try again")}</div></div>`;
    }
    const res = r.result || {};
    const have = new Set((p.focus || []).map((f) => f.toLowerCase()));
    const sugg = (res.focusAreas || []).map((f) => String(f?.phrase || f)).filter(Boolean);
    return `<div class="research"><div class="top"><b>Web research draft</b><span class="note">Claude, ${fmtDate(r.finishedAt)} · ${(res.sources || []).length} sources</span></div>
      ${res.summary ? `<div class="prose" style="font-size:13px">${esc(res.summary)}</div>` : ""}
      ${(res.capabilities || []).length ? `<div class="note"><b>Could contribute:</b> ${esc(res.capabilities.join("; "))}</div>` : ""}
      ${(res.programs || []).length ? `<div class="note"><b>Programs and facilities:</b> ${esc(res.programs.join("; "))}</div>` : ""}
      ${res.notes ? `<div class="note"><b>Notes:</b> ${esc(res.notes)}</div>` : ""}
      ${sugg.length ? `<div class="note">Suggested focus areas · number = open opportunities it matches now</div>
        <div class="sugg">${sugg.map((f) => { const n = openMatches(f), had = have.has(f.toLowerCase());
          return `<label class="${had ? "have" : ""}"><input type="checkbox" data-sugg="${esc(r.id)}" value="${esc(f)}" ${had ? "disabled" : n > 0 ? "checked" : ""} ${ro()}>${esc(f)} <span class="n ${n ? "hit" : ""}">${n}</span></label>`; }).join("")}</div>` : ""}
      ${(res.sources || []).length ? `<details><summary class="note">Sources</summary><ol>${res.sources.map((x) => `<li>${safeUrl(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>` : esc(x.title || "")}</li>`).join("")}</ol></details>` : ""}
      <div class="btns">${sugg.length ? `<button class="btn" data-addsugg="${esc(r.id)}" ${ro()}>Add selected to focus areas</button>` : ""}
        ${res.summary ? `<button class="btn-ghost" data-usesummary="${esc(r.id)}" ${ro()}>${p.summary ? "Replace summary with this" : "Use this summary"}</button>` : ""}
        ${btn("Research again")}</div></div>`;
  }

  // ---------- categories ----------
  function viewCategories() {
    const e = editing.category && editing.category !== "new" ? S.categories[editing.category] || {} : {};
    const isNew = !editing.category || editing.category === "new";
    const key = editing.category || "new";

      <section class="panel"><h2>${isNew ? "Add a category" : "Edit category"}</h2>
        <div class="form">
          ${field("c-name", "Name", e.name, 'placeholder="Grid cybersecurity" maxlength="80"')}
          ${areaField("c-kw", "Keywords", (e.keywords || []).join(", "), "Comma-separated. Matched against each opportunity's title, description and eligibility.")}
          <div class="wide" style="grid-column:1/-1;display:grid;gap:6px"><span class="note">Team members</span>
            <div class="people" id="c-members">${draftMembers[key].map((id) => personHtml(id, canWrite)).join("") || `<span class="help">No one yet.</span>`}</div>
            ${user?.search ? `<div class="picker"><input id="c-search" placeholder="Add a team member by name…" autocomplete="off" ${ro()}><ul id="c-results" hidden></ul></div>` : `<p class="help">Team member search isn't available in this view.</p>`}
          </div>
          ${formActions("category", isNew)}
        </div></section>
      <section class="items">${sorted(S.categories).map((c) => {

          <div class="chips">${(c.keywords || []).map((k) => `<span>${esc(k)}</span>`).join("")}</div>
          <div class="people">${(c.members || []).map((id) => personHtml(id)).join("") || `<span class="help">No team members assigned.</span>`}</div>
          <div class="btns">${me ? `<button class="btn-ghost" data-join="${esc(c.id)}" ${ro()}>${member ? "Leave" : "Join"}</button>` : ""}${editBtn("category", c.id)}${removeBtn("category", c.id)}</div></div>`;
      }).join("") || `<p class="panel empty">No categories yet. Add one, for example "Grid cybersecurity" with keywords like OT, ICS, SCADA, utility.</p>`}</section>`;

  // ---------- profile (editable) ----------
  const PROFILE_LISTS = [["capabilities", "Capabilities"], ["partners", "Core partners"], ["goodFit", "Good fit"], ["poorFit", "Poor fit"], ["decisionCriteria", "Decision criteria"]];
  const DEFAULT_CRITERIA = ["Forge leads or partners; each opportunity shows which role is open", "No cash match", "Indirect costs allowed", "Funds operating expenses", "Open solicitation (no invitation required)"];
  // The repo's profile file stores decisionCriteria as flags; the team's edited list is an array.
  const critOf = (p) => Array.isArray(p.decisionCriteria) ? p.decisionCriteria : DEFAULT_CRITERIA;
  function viewProfile() {
    const p = P(), ul = (xs) => `<ul style="margin:0;padding-left:18px">${(xs || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
    const crit = critOf(p);
    const team = sorted(S.keywords, "text");
    const edited = S.profile.main;
    const who = edited?.updatedBy ? names[edited.updatedBy] || "a teammate" : null;
    const head = `<div class="head"><div><h1>Forge profile</h1><p class="sub" style="margin:4px 0 0">What the screening rules and Claude use to judge fit.${edited ? ` Last edited ${fmtDate(edited.updatedAt)}${who ? ` by ${esc(who)}` : ""}.` : ""}</p></div>
      ${editing.profile ? "" : `<button class="btn" data-editprofile="1" ${ro()}>Edit profile</button>`}</div>`;
    const keywords = `<section class="panel"><h2>Search keywords</h2>
        <p class="help" style="margin-bottom:8px">The scanner searches Grants.gov for each of these. Changes apply from the next scan on.</p>

        <form class="search" id="kw-form" style="max-width:520px"><input id="kw-input" placeholder="Add keywords, comma-separated" maxlength="400" style="flex:1;width:auto" ${ro()}><button class="btn" ${ro()}>Add</button></form>

    if (editing.profile) {
      return `${head}<section class="panel"><h2>Edit profile</h2>

          ${field("pf-lead", "Forge internal deadline: days before submission", leadDays(), 'type="number" min="1" max="90"')}
          <p class="help" style="grid-column:1/-1">Edits show here right away. The scanner and Claude's scoring pick them up once the scanner is set to read this page (it uses the profile file in the repo until then).</p>
          <div class="actions"><button class="btn" data-saveprofile="1" ${ro()}>Save profile</button><button class="btn-ghost" data-cancelprofile="1">Cancel</button><span class="toast" id="profile-toast">${esc(flash["profile-toast"] || "")}</span></div>
        </div></section>${keywords}`;
    }
    return `${head}
      <div class="panel prose"><p>${esc(p.summary)}</p></div>
      ${keywords}
      <div class="grid2">
        <div class="panel"><h2>Capabilities</h2>${ul(p.capabilities)}</div><div class="panel"><h2>Core partners</h2>${ul(p.partners)}<p class="help" style="margin-top:8px">Add more, with focus areas, on the <a href="#partners">Partners</a> tab.</p></div>
        <div class="panel"><h2>Good fit</h2>${ul(p.goodFit)}</div><div class="panel"><h2>Poor fit</h2>${ul(p.poorFit)}</div>
        <div class="panel"><h2>Decision criteria</h2>${ul([...crit, `Forge internal deadline ${leadDays()} days before submission`])}</div>
      </div>
      <p class="toast" id="profile-toast">${esc(flash["profile-toast"] || "")}</p>`;
  }

  // ---------- history ----------
  const KIND_LABEL = { rating: "Rating", decision: "Decision", source: "Source", partner: "Partner", category: "Category", keyword: "Keyword", profile: "Profile" };
  const show = (v) => v === null || v === undefined || v === "" ? "(empty)" : Array.isArray(v) ? (v.length ? v.join(", ") : "(empty)") : String(v);
  const changeHtml = (c) => c.added || c.removed
    ? `<div class="chg"><b>${esc(c.label)}</b>: ${[...(c.added || []).map((x) => `<ins>+ ${esc(x)}</ins>`), ...(c.removed || []).map((x) => `<del>${esc(x)}</del>`)].join(" · ") || "reordered"}</div>`
    : `<div class="chg"><b>${esc(c.label)}</b>: ${c.from !== undefined ? `<del>${esc(show(c.from))}</del> → ` : ""}<ins>${esc(show(c.to))}</ins></div>`;
  function entryHtml(h, withTarget = true) {
    const who = h.by ? names[h.by] || "A teammate" : h.source === "claude" ? "Claude" : "Someone";
    const target = !withTarget ? "" : h.kind === "decision" || h.kind === "rating" ? `<a href="#opp-${esc(h.targetId)}">${esc(h.targetName)}</a>` : `<b>${esc(h.targetName || "")}</b>`;
    return `<li><div style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline"><span class="kind">${KIND_LABEL[h.kind] || esc(h.kind)}</span><span>${esc(who)} ${esc(h.action)} ${target}</span><span class="when">${new Date(h.at).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}</span></div>
      ${(h.changes || []).map(changeHtml).join("")}</li>`;
  }
  function viewHistory() {
    const all = Object.entries(S.history).map(([id, h]) => ({ id, ...h })).sort((a, b) => String(b.at).localeCompare(String(a.at)));
    const people = [...new Set(all.map((h) => h.by).filter(Boolean))];
    const items = all.filter((h) => (!hf.kind || h.kind === hf.kind) && (!hf.who || h.by === hf.who));
    const opt = (v, l, cur) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`;
    return `<div class="head"><div><h1>History</h1><p class="sub" style="margin:4px 0 0">Every change made on this page: who made it, when, and what it was before and after. Showing the latest ${Math.min(all.length, 500)}.</p></div></div>
      <div class="panel filters" id="hfilters">
        <select id="h-kind" aria-label="Type of change">${opt("", "All changes", hf.kind)}${Object.entries(KIND_LABEL).map(([k, l]) => opt(k, l + "s", hf.kind)).join("")}</select>
        <select id="h-who" aria-label="Person">${opt("", "Everyone", hf.who)}${people.map((id) => opt(id, names[id] || "A teammate", hf.who)).join("")}</select>
      </div>
      <section class="panel">${items.length ? `<ul class="hist">${items.map((h) => entryHtml(h)).join("")}</ul>` : `<p class="empty">${all.length ? "No changes match these filters." : "No changes recorded yet. Changes made from now on appear here."}</p>`}</section>`;
  }

  // ---------- routing ----------
  const route = () => (location.hash || "#dashboard").slice(1);
  const VIEWS = { opportunities: viewOpportunities, pipeline: viewPipeline, federal: viewFederal, report: viewReport, profile: viewProfile, history: viewHistory, sources: viewSources, partners: viewPartners, categories: viewCategories };
  function render() {
    const r = route();
    const tab = r.startsWith("opp-") ? "opportunities" : VIEWS[r] ? r : "dashboard";
    const mineCount = myCats().length ? OPPS.filter(isOpen).filter((o) => myCats().some((c) => hits(o, c.keywords).length) && (fit(o) ?? 0) >= 5).length : 0;
    document.querySelectorAll("#tabs a").forEach((a) => {
      const h = a.getAttribute("href");
      if (h === "#" + tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      if (h === "#dashboard") a.innerHTML = `Dashboard${mineCount ? `<span class="nav-badge" title="Open opportunities scoring 5+ in your categories">${mineCount}</span>` : ""}`;
    });
    app.innerHTML = r.startsWith("opp-") ? viewDetail(r.slice(4)) : (VIEWS[r] || viewDashboard)();
  }
  const saveFilters = () => { try { localStorage.setItem("fg-filters", JSON.stringify(ui)); } catch {} };
  const CLEAR = { q: "", min: "", agency: "", stage: "", cat: "", role: "", partner: false, clean: false, closed: false, stars: "", starBasis: ui.starBasis || "mine", unrated: true };
  const go = (hash, patch) => { Object.assign(ui, patch || {}); saveFilters(); if (location.hash === hash) render(); else location.hash = hash; };
  // Re-render on shared-data changes without clobbering a field someone is typing in.
  let dirty = false;
  let dragId = null;   // card being dragged on the pipeline board   // the viewer has typed into a form that isn't saved yet
  let heldRender = false;   // a live update arrived mid-drag; redraw when the drag ends
  function softRender() {
    if (dragId) { heldRender = true; return; }
    const f = document.activeElement;
    if (dirty) return route().startsWith("opp-") ? refreshRatings() : undefined;
    if (route() === "pipeline" && f && f.closest && f.closest("#filters, #board")) return refreshBoard();
    if (f && f.closest && f.closest("#decision, #filters, #hfilters, .form, #kw-form, .picker, .sugg")) return;
    // Someone rating in the list or on a detail page: redraw only the ratings so nothing else jumps or resets.
    if (f && f.closest && f.closest("#results, #my-stars")) return refreshRatings();
    render();
  }
  addEventListener("hashchange", () => { armed.clear(); dirty = false; editing.profile = false; for (const k in flash) delete flash[k]; render(); scrollTo(0, 0); });

  // ---------- writes ----------
  const flash = {};   // toast id -> message, so a re-render from a live update keeps it
  const toast = (id, msg) => { flash[id] = msg; const t = document.getElementById(id); if (t) t.textContent = msg; };
  const errMsg = (err) => ["permission_denied", "not_granted", "forbidden"].includes(err?.code) ? "You don't have permission to change this." : err?.code === "quota_exceeded" ? "The page's storage is full. Remove old entries and try again." : "Couldn't save. Check your connection and try again.";
  const stamp = async (body) => { body.updatedAt = new Date().toISOString(); try { const uid = await user?.id?.(); if (uid) body.updatedBy = uid; } catch {} return body; };

  // Field-by-field diff for the change log. Long text is clipped in the log only.
  const clip = (v) => typeof v === "string" && v.length > 400 ? v.slice(0, 400) + "…" : Array.isArray(v) ? v.map(clip) : v;
  const same = (a, b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");
  function diff(before, after, labels) {
    return Object.entries(labels).filter(([k]) => !same(before?.[k], after?.[k])).map(([k, label]) => {
      const a = before?.[k], b = after?.[k];
      // For an edited list, record just the items added and removed.
      if (before && after && Array.isArray(a) && Array.isArray(b)) return { field: k, label, added: b.filter((x) => !a.includes(x)).map(clip), removed: a.filter((x) => !b.includes(x)).map(clip) };
      return { field: k, label, ...(before ? { from: clip(a ?? null) } : {}), to: clip(b ?? null) };
    });
  }
  async function logChange(entry) {
    if (!db) return;
    try {
      const by = await user?.id?.();
      await db.collection("history").add({ at: new Date().toISOString(), ...(by ? { by } : {}), ...entry });
    } catch { /* the change itself was saved; a missed log entry should not block the user */ }
  }
  const LABELS = {
    decision: { stage: "Stage", reviewDate: "Forge internal deadline", owner: "Owner", notes: "Notes" },
    source: { name: "Name", type: "Type", url: "Website", apiUrl: "API URL", credential: "Key name", status: "Status", notes: "Notes" },
    partner: { name: "Name", type: "Type", url: "Link", contact: "Contact", summary: "Focus summary", focus: "Focus areas", notes: "Notes" },
    category: { name: "Name", keywords: "Keywords", members: "Team members" },
    profile: { summary: "Summary", capabilities: "Capabilities", partners: "Core partners", goodFit: "Good fit", poorFit: "Poor fit", decisionCriteria: "Decision criteria", internalReviewLeadDays: "Internal deadline lead days", searchKeywords: "Built-in keywords" },
  };
  // Team members are stored as ids; log their names as this viewer sees them so the log stays readable.
  const memberNames = (ids) => (ids || []).map((id) => names[id] || "a teammate");

  async function saveDecision() {
    const box = document.getElementById("decision"); if (!box || !db) return;
    const o = OPPS.find((x) => x.id === box.dataset.id);
    const review = val("d-review");
    const def = defaultInternal(o);
    const body = await stamp({
      stage: val("d-stage"), owner: val("d-owner").slice(0, 120), notes: (document.getElementById("d-notes").value || "").slice(0, 20000),
      // Only store a date when it differs from the 2-week default, so the default keeps tracking the deadline.
      reviewDate: review && (!def || review !== def.slice(0, 10)) ? new Date(review + "T12:00:00Z").toISOString() : null,
    });
    box.querySelectorAll("button").forEach((b) => (b.disabled = true));
    toast("d-toast", "Saving…");
    const prevRaw = S.decisions[o.id];
    const before = { stage: stageOf(o), owner: prevRaw?.owner || "", notes: prevRaw?.notes || "", reviewDate: (internalOf(o) || "").slice(0, 10) || null };
    const after = { stage: body.stage, owner: body.owner, notes: body.notes, reviewDate: (body.reviewDate || defaultInternal(o) || "").slice(0, 10) || null };
    const changes = diff(before, after, LABELS.decision).map((c) => c.field === "stage" ? { ...c, from: LABEL[c.from] || c.from, to: LABEL[c.to] || c.to } : c);
    try {
      await db.doc("decisions/" + o.id).set(body); dirty = false; toast("d-toast", changes.length ? "Saved" : "No changes to save");
      if (changes.length) logChange({ kind: "decision", action: "updated", targetId: o.id, targetName: o.title, changes });
    }
    catch (err) { toast("d-toast", errMsg(err)); }
    finally { box.querySelectorAll("button").forEach((b) => (b.disabled = !canWrite)); }
  }

  async function saveItem(kind) {
    if (!db) return;
    const t = kind + "-toast";
    let body, coll;
    if (kind === "source") {
      const name = val("s-name"), url = val("s-url"), apiUrl = val("s-api"), credential = val("s-cred");
      if (!name) return toast(t, "Give the source a name.");
      if (url && !safeUrl(url)) return toast(t, "The website URL should start with https://");
      if (apiUrl && !safeUrl(apiUrl)) return toast(t, "The API URL should start with https://");
      if (credential && !/^[A-Za-z][A-Za-z0-9_]{1,63}$/.test(credential)) return toast(t, "Use a short name like CONNECTWERX_API_KEY (letters, numbers, underscores), not the key itself.");
      if (credential && credential.length > 24 && /\d/.test(credential) && /[a-z]/.test(credential) && /[A-Z]/.test(credential)) return toast(t, "That looks like an actual key. Enter a name for it instead, like CONNECTWERX_API_KEY.");
      coll = "sources"; body = { name, type: val("s-type"), url, apiUrl, credential: credential.toUpperCase(), status: val("s-status"), notes: val("s-notes").slice(0, 2000) };
    } else if (kind === "partner") {
      const name = val("p-name"), url = val("p-url");
      if (!name) return toast(t, "Give the partner a name.");
      if (url && !safeUrl(url)) return toast(t, "The link should start with https://");
      coll = "partners"; body = { name, type: val("p-type"), url, contact: val("p-contact"), summary: (document.getElementById("p-summary")?.value || "").trim().slice(0, 2000), focus: splitList(val("p-focus")), notes: val("p-notes").slice(0, 2000) };
    } else {
      const name = val("c-name");
      if (!name) return toast(t, "Give the category a name.");
      const kws = splitList(val("c-kw"));
      if (!kws.length) return toast(t, "Add at least one keyword so the category can match opportunities.");
      coll = "categories"; body = { name, keywords: kws, members: draftMembers[editing.category || "new"] || [] };
    }
    await stamp(body);
    toast(t, "Saving…");
    try {
      const id = editing[kind];
      const isEdit = id && id !== "new"; dirty = false;
      const prev = isEdit ? S[coll][id] : null;
      const view = (x) => x && kind === "category" ? { ...x, members: memberNames(x.members) } : x;
      let savedId = id;
      if (isEdit) await db.doc(`${coll}/${id}`).set(body);
      else { const ref = db.collection(coll).doc(); await ref.set(body); savedId = ref.id; }
      if (kind === "partner") {
        await attachFormDocs(savedId, body.name);
        const wantResearch = document.getElementById("p-research")?.checked;
        const linkChanged = !isEdit || (prev?.url || "") !== body.url;
        if (wantResearch && body.url && linkChanged) queueResearch(savedId, body);
      }
      const changes = diff(view(prev), view(body), LABELS[kind]);
      if (changes.length) logChange({ kind, action: isEdit ? "updated" : "added", targetId: id || "", targetName: body.name, changes });
      editing[kind] = null; delete draftMembers[id || "new"];
      if (kind === "partner") resetPartnerForm();
      render(); toast(t, id && id !== "new" ? "Saved" : "Added");
    } catch (err) { toast(t, errMsg(err)); }
  }

  async function removeItem(kind, id) {
    const coll = { source: "sources", partner: "partners", category: "categories" }[kind];
    const prev = S[coll][id];
    try {
      await db.doc(`${coll}/${id}`).delete(); armed.delete(kind + ":" + id); if (editing[kind] === id) editing[kind] = null;
      logChange({ kind, action: "removed", targetId: id, targetName: prev?.name || "", changes: diff(kind === "category" ? { ...prev, members: memberNames(prev?.members) } : prev, null, LABELS[kind]).filter((c) => c.from !== null && c.from !== "").map((c) => ({ ...c, to: null })) });
    }
    catch (err) { alertInline(errMsg(err)); }
  }
  const alertInline = (msg) => { const b = document.querySelector(".head .sub"); if (b) b.textContent = msg; };

  async function toggleJoin(id) {
    const c = S.categories[id]; if (!c || !me) return;
    const members = new Set(c.members || []);
    members.has(me) ? members.delete(me) : members.add(me);
    const joining = members.has(me);
    try {
      await db.doc("categories/" + id).update({ members: [...members] });
      logChange({ kind: "category", action: joining ? "joined" : "left", targetId: id, targetName: c.name, changes: [] });
    } catch (err) { alertInline(errMsg(err)); }
  }

  async function addKeywords() {
    const words = splitList(val("kw-input"));
    if (!words.length) return;
    const existing = new Set([...P().searchKeywords, ...Object.values(S.keywords).map((k) => k.text)].map((x) => x.toLowerCase()));
    const fresh = words.filter((w) => !existing.has(w.toLowerCase()) && w.length <= 80);
    if (!fresh.length) return toast("kw-toast", "Those keywords are already on the list.");
    toast("kw-toast", "Saving…");
    try {
      for (const text of fresh) await db.collection("keywords").add(await stamp({ text }));
      logChange({ kind: "keyword", action: "added", targetName: fresh.join(", "), changes: [{ field: "keywords", label: "Keywords added", to: fresh }] });
      render(); toast("kw-toast", `Added ${fresh.length} keyword${fresh.length > 1 ? "s" : ""}`);
    } catch (err) { toast("kw-toast", errMsg(err)); }
  }

  const PROFILE_KEYS = ["summary", "capabilities", "partners", "goodFit", "poorFit", "decisionCriteria", "internalReviewLeadDays", "searchKeywords"];
  const profileSnapshot = () => { const p = P(); return { ...Object.fromEntries(PROFILE_KEYS.map((k) => [k, p[k]])), decisionCriteria: critOf(p), internalReviewLeadDays: leadDays() }; };
  async function writeProfile(patch, toastId) {
    const before = profileSnapshot();
    const after = { ...before, ...patch };
    const changes = diff(before, after, LABELS.profile);
    if (!changes.length) { toast(toastId, "No changes to save"); return false; }
    const body = await stamp({ ...after });
    await db.doc("profile/main").set(body);
    logChange({ kind: "profile", action: "updated", targetName: "Forge profile", changes });
    return true;
  }
  async function saveProfile() {
    if (!db) return;
    const lines = (id) => [...new Set((document.getElementById(id)?.value || "").split("\n").map((x) => x.trim()).filter(Boolean))].slice(0, 60);
    const summary = (document.getElementById("pf-summary")?.value || "").trim().slice(0, 5000);
    if (!summary) return toast("profile-toast", "The summary can't be empty. Claude uses it to judge fit.");
    const lead = Number(val("pf-lead"));
    if (!Number.isInteger(lead) || lead < 1 || lead > 90) return toast("profile-toast", "Enter a whole number of days between 1 and 90.");
    const patch = { summary, internalReviewLeadDays: lead };
    PROFILE_LISTS.forEach(([k]) => (patch[k] = lines("pf-" + k)));
    toast("profile-toast", "Saving…");
    try { if (await writeProfile(patch, "profile-toast")) { dirty = false; editing.profile = false; render(); toast("profile-toast", "Profile saved"); } }
    catch (err) { toast("profile-toast", errMsg(err)); }
  }
  async function removeBaseKeyword(k) {
    if (!db) return;
    try { await writeProfile({ searchKeywords: (P().searchKeywords || []).filter((x) => x !== k) }, "kw-toast"); toast("kw-toast", `Removed "${k}"`); }
    catch (err) { toast("kw-toast", errMsg(err)); }
  }

  async function rate(oppId, n) {
    if (!db || !me || !canWrite) return;
    const o = OPPS.find((x) => x.id === oppId); if (!o) return;
    const prev = myRating(o), next = prev === n ? 0 : n;   // clicking your current rating clears it
    const mineDoc = { ...(S.ratings[me] || {}) };
    if (next) mineDoc[oppId] = next; else delete mineDoc[oppId];
    S.ratings = { ...S.ratings, [me]: mineDoc };   // show it right away
    refreshRatings();
    try {
      await db.doc("ratings/" + me).set(mineDoc);
      logChange({ kind: "rating", action: next ? "rated" : "cleared their rating on", targetId: oppId, targetName: o.title,
        changes: [{ field: "stars", label: "Stars", from: prev || null, to: next || null }] });
    } catch (err) {
      alertInline(errMsg(err));
    }
  }
  // Re-draw just the parts that show ratings, so a click doesn't reset scroll or filters.
  function refreshRatings() {
    const f = document.activeElement, again = f?.dataset?.rate ? `[data-rate="${f.dataset.rate}"][data-id="${f.dataset.id}"]` : null;
    redrawRatings();
    if (again) document.querySelector(again)?.focus();
  }
  function redrawRatings() {
    const box = document.getElementById("my-stars");
    if (box) { const o = OPPS.find((x) => x.id === box.dataset.id); if (o) box.innerHTML = starsHtml(o); return; }
    if (route() === "opportunities") {
      const items = filtered();
      document.getElementById("results").innerHTML = table(items.slice(0, 300), "No opportunities match these filters.");
      const n = document.querySelector(".head .sub .num"); if (n) n.textContent = items.length;
    } else render();
  }

  // ---------- events ----------
  app.addEventListener("click", (e) => {
    const t = e.target.closest("button, a"); if (!t) return;
    const ds = t.dataset;
    if (t.matches("a[data-min],a[data-stage],a[data-agency],a[data-cat],a[data-reset],a[data-mycats]")) {
      e.preventDefault();
      return go("#opportunities", { ...CLEAR, min: ds.min || "", stage: ds.stage || "", agency: ds.agency || "", cat: ds.mycats ? "@mine" : ds.cat || "" });
    }
    if (t.id === "f-reset") return go(route() === "pipeline" ? "#pipeline" : "#opportunities", CLEAR);
    if (ds.rate) return rate(ds.id, Number(ds.rate));
    if (ds.analyze) return analyzeDoc(ds.analyze);
    if (ds.research) return queueResearch(ds.research);
    if (ds.coach) return requestCoaching(ds.coach);
    if (ds.usesummary) return applyResearchSummary(ds.usesummary);
    if (ds.addsugg) return addSuggested(ds.addsugg);
    if (ds.deldoc) return removeDoc(ds.deldoc);
    if (ds.decide) { document.getElementById("d-stage").value = ds.decide; return saveDecision(); }
    if (t.id === "d-save") return saveDecision();
    if (ds.save) return saveItem(ds.save);
    if (ds.cancel || ds.cancelprofile) dirty = false;
    if (ds.cancel) { delete draftMembers[editing[ds.cancel]]; editing[ds.cancel] = null; if (ds.cancel === "partner") resetPartnerForm(); return render(); }
    if (ds.edit) { editing[ds.edit] = ds.id; delete draftMembers[ds.id]; if (ds.edit === "partner") resetPartnerForm(ds.id); render(); return scrollTo(0, 0); }
    if (ds.gendraft) return draftPartner(true);
    if (ds.usedraft) return applyDraft(true);
    if (ds.unformdoc !== undefined) { pform.docs.splice(Number(ds.unformdoc), 1); return refreshFormDocs(); }
    if (ds.arm) { armed.add(ds.arm); return render(); }
    if (ds.disarm) { armed.delete(ds.disarm); return render(); }
    if (ds.remove) return removeItem(ds.remove, ds.id);
    if (ds.join) return toggleJoin(ds.join);
    if (ds.delkw) {
      const text = S.keywords[ds.delkw]?.text;
      return db?.doc("keywords/" + ds.delkw).delete()
        .then(() => logChange({ kind: "keyword", action: "removed", targetName: text, changes: [{ field: "keywords", label: "Keyword removed", from: text, to: null }] }))
        .catch((err) => toast("kw-toast", errMsg(err)));
    }
    if (ds.delbase) return removeBaseKeyword(ds.delbase);
    if (ds.editprofile) { editing.profile = true; for (const k in flash) delete flash[k]; return render(); }
    if (ds.cancelprofile) { editing.profile = false; return render(); }
    if (ds.saveprofile) return saveProfile();
    if (ds.unpick) { const k = editing.category || "new"; draftMembers[k] = (draftMembers[k] || []).filter((x) => x !== ds.unpick); return refreshMembers(); }
    if (ds.pick) {
      const k = editing.category || "new"; draftMembers[k] = [...new Set([...(draftMembers[k] || []), ds.pick])];
      const s = document.getElementById("c-search"); s.value = ""; document.getElementById("c-results").hidden = true; s.focus();
      return refreshMembers();
    }
  });
  function refreshMembers() {
    const k = editing.category || "new", box = document.getElementById("c-members");
    if (box) box.innerHTML = (draftMembers[k] || []).map((id) => personHtml(id, canWrite)).join("") || `<span class="help">No one yet.</span>`;
  }
  app.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "qform") go("#opportunities", { ...CLEAR, q: val("dash-q") });
    if (e.target.id === "kw-form") addKeywords();
  });
  app.addEventListener("change", (e) => {
    if (e.target.dataset?.move) return moveCard(e.target.dataset.move, e.target.value);
    if (e.target.id === "p-files") { const files = [...e.target.files]; e.target.value = ""; if (files.length) addFormFiles(files); return; }
    if (e.target.id === "p-url") { const u = e.target.value.trim(); if (safeUrl(u) && u !== pform.lastUrl) draftPartner(false); return; }
    if (e.target.dataset?.upload) { const files = [...e.target.files]; e.target.value = ""; if (files.length) uploadDocs(e.target.dataset.upload, files); }
  });

  app.addEventListener("dragstart", (e) => {
    const card = e.target.closest?.(".card[data-card]"); if (!card) return;
    dragId = card.dataset.card; card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch {}
  });
  app.addEventListener("dragend", (e) => {
    e.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".over").forEach((x) => x.classList.remove("over")); dragId = null;
    if (heldRender) { heldRender = false; softRender(); }
  });
  app.addEventListener("dragover", (e) => {
    const zone = dragId && e.target.closest?.("[data-col]"); if (!zone) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".over").forEach((x) => x !== zone && x.classList.remove("over"));
    zone.classList.add("over");
  });
  app.addEventListener("dragleave", (e) => { const zone = e.target.closest?.("[data-col]"); if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("over"); });
  app.addEventListener("drop", (e) => {
    const zone = e.target.closest?.("[data-col]"); if (!zone || !dragId) return;
    e.preventDefault(); zone.classList.remove("over");
    const id = dragId; dragId = null; heldRender = false;
    moveCard(id, zone.dataset.col);
  });
  let typing;
  app.addEventListener("input", (e) => {
    if (e.target.closest("#decision, .form")) dirty = true;
    if (e.target.id === "p-summary") { pform.edited.summary = true; pform.summary = e.target.value; }
    if (e.target.id === "p-focus") { pform.edited.focus = true; pform.focus = e.target.value; }
  });
  app.addEventListener("input", async (e) => {
    if (e.target.id === "c-search") {
      const list = document.getElementById("c-results");
      const found = await user.search(e.target.value);
      found.forEach((p) => { names[p.id] = p.name; avatars[p.id] = p.avatarUrl; });
      list.innerHTML = found.slice(0, 8).map((p) => `<li><button type="button" data-pick="${esc(p.id)}"><img src="${esc(p.avatarUrl)}" alt="">${esc(p.name)}${p.guest ? ' <span class="note">guest</span>' : ""}</button></li>`).join("") || `<li class="help" style="padding:6px">No matches.</li>`;
      list.hidden = false;
      return;
    }
    if (e.target.id === "h-kind" || e.target.id === "h-who") { hf[e.target.id === "h-kind" ? "kind" : "who"] = e.target.value; return render(); }
    if (!e.target.closest("#filters")) return;
    const map = { "f-q": "q", "f-min": "min", "f-agency": "agency", "f-stage": "stage", "f-cat": "cat", "f-role": "role", "f-stars": "stars", "f-basis": "starBasis" };
    if (map[e.target.id]) ui[map[e.target.id]] = e.target.value;
    if (e.target.id === "f-clean") ui.clean = e.target.checked;
    if (e.target.id === "f-closed") ui.closed = e.target.checked;
    if (e.target.id === "f-partner") ui.partner = e.target.checked;
    if (e.target.id === "f-unrated") ui.unrated = e.target.checked;
    saveFilters();
    clearTimeout(typing);
    typing = setTimeout(() => {
      if (route() === "pipeline") return refreshBoard();
      const items = filtered(); document.getElementById("results").innerHTML = table(items.slice(0, 300), "No opportunities match these filters."); document.querySelector(".head .sub .num").textContent = items.length;
    }, 120);
  });
  app.addEventListener("focusin", async (e) => { if (e.target.id === "c-search" && user?.search) { const found = await user.search(""); found.forEach((p) => { names[p.id] = p.name; avatars[p.id] = p.avatarUrl; }); } });

  // ---------- people ----------
  async function resolveNames() {
    if (!user?.profiles) return;
    const ids = new Set();
    Object.values(S.decisions).forEach((d) => d.updatedBy && ids.add(d.updatedBy));
    Object.values(S.history).forEach((h) => h.by && ids.add(h.by));
    Object.keys(S.ratings).forEach((uid) => ids.add(uid));
    if (S.profile.main?.updatedBy) ids.add(S.profile.main.updatedBy);
    Object.values(S.categories).forEach((c) => (c.members || []).forEach((m) => ids.add(m)));
    Object.values(draftMembers).forEach((l) => l.forEach((m) => ids.add(m)));
    if (me) ids.add(me);
    if (!ids.size) return;
    try {
      const ps = await user.profiles([...ids]);
      let changed = false;
      for (const id of ids) { const p = ps[id]; if (!p) continue; if (names[id] !== p.name || avatars[id] !== p.avatarUrl) changed = true; names[id] = p.name; avatars[id] = p.avatarUrl; }
      if (changed) softRender();
    } catch {}
  }

  // ---------- store connection ----------
  async function connect() {
    const timer = setTimeout(() => { if (storeState === "connecting") { storeState = "offline"; softRender(); } }, 10000);
    try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch { db = null; }
    if (!db) { clearTimeout(timer); storeState = "offline"; softRender(); return; }
    canWrite = user?.can ? user.can("data.write") !== false : true;
    try { me = (await user?.id?.()) || null; } catch { me = null; }
    let pending = Object.keys(S).length;
    for (const coll of Object.keys(S)) {
      const q = coll === "history" ? db.collection("history").orderBy("at", "desc").limit(500) : db.collection(coll);
      q.onSnapshot((snap) => {
        const next = {}; snap.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
        S[coll] = next;
        if (pending > 0 && --pending === 0) clearTimeout(timer);
        storeState = "ready"; softRender(); resolveNames();
      }, () => { clearTimeout(timer); if (storeState !== "ready") storeState = "offline"; softRender(); });
    }
  }

  Promise.all([fetch("opportunities.json").then((r) => r.json()), fetch("meta.json").then((r) => r.json())])
    .then(([opps, meta]) => { OPPS = opps; META = meta; render(); connect(); })
    .catch((e) => { console.error(e); app.innerHTML = `<p class="panel empty">The opportunity data didn't load. Reload the page to try again.</p>`; });
})();
</script>
