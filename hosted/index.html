    if (ds.pick) {
      const k = editing.category || "new"; draftMembers[k] = [...new Set([...(draftMembers[k] || []), ds.pick])];
      const s = document.getElementById("c-search"); s.value = ""; document.getElementById("c-results").hidden = true; s.focus();
      return refreshMembers();
    }
  });
  document.addEventListener("click", (e) => { for (const [inp, ul] of [["d-psearch", "d-presults"], ["d-osearch", "d-oresults"]]) { const l = document.getElementById(ul); if (l && !l.hidden && !e.target.closest(`#${ul}`) && e.target.id !== inp) l.hidden = true; } });
  function refreshMembers() {
    const k = editing.category || "new", box = document.getElementById("c-members");
    if (box) box.innerHTML = (draftMembers[k] || []).map((id) => personHtml(id, canWrite)).join("") || `<span class="help">No one yet.</span>`;
  }
  // Remember whether the add-partner panel is open, so a live update doesn't fold it shut.
  app.addEventListener("toggle", (e) => { if (e.target.id === "pform") pform.open = e.target.open; if (e.target.id === "consdetails") consClosed = !e.target.open; }, true);
  app.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id?.startsWith?.("sb-cm-")) { e.preventDefault(); const k = Number(e.target.id.slice(6)); if (SB.id) addComment(SB.id, k); return; }
    if (e.key === "Enter" && e.target.closest?.("#quickadd") && e.target.tagName === "INPUT") { e.preventDefault(); const b = document.querySelector("[data-addkid]"); if (b) addChildInline(b.dataset.addkid, "ck", "kid-toast"); }
  });
  app.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "qform") go("#opportunities", { ...CLEAR, q: val("dash-q") });
    if (e.target.id === "kw-form") addKeywords();
    if (e.target.id === "ao-form") { addOpp.q = val("ao-q"); addOpp.results = findExisting(addOpp.q); addOppStatus(""); render(); }
    if (e.target.id === "cfg-form") { const v = val("cfg-name"); if (v) saveConfig(v); return; }
    if (e.target.id === "topic-form") { const v = val("topic-in"); document.getElementById("topic-in").value = ""; addTopic(v); }
  });
  app.addEventListener("change", (e) => {
    if (e.target.dataset?.move) return moveCard(e.target.dataset.move, e.target.value);
    if (e.target.dataset?.tpick) return togglePick(e.target.dataset.tpick);
    if (e.target.dataset?.tcons) { const c = S.consortia[e.target.dataset.tcons], keys = consMembers(c).map((pid) => "p:" + pid), b = tBoard();
      const items = e.target.checked ? [...new Set([...b.items, ...keys])].slice(0, 30) : b.items.filter((k) => !keys.includes(k));
      return saveBoard({ items }, { action: e.target.checked ? "added a consortium to the picks:" : "removed a consortium from the picks:", targetName: c?.name || "", changes: [] }); }
    if (e.target.dataset?.csmember) { const id = e.target.dataset.csmember; cform.members = e.target.checked ? [...new Set([...cform.members, id])] : cform.members.filter((x) => x !== id); const n = document.querySelector("#consform .note"); if (n) n.textContent = `Members (${cform.members.length} picked)`; dirty = true; return; }
    if (e.target.dataset?.pull) { TM.pull[e.target.dataset.pull] = e.target.checked; return render(); }
    if (e.target.dataset?.ttype) { TM.types[e.target.dataset.ttype] = e.target.checked; return render(); }
    if (e.target.id === "d-cat") { ui.dcat = e.target.value; saveFilters(); return render(); }
    if (e.target.id === "d-csort") { ui.dcsort = e.target.value; saveFilters(); return render(); }
    if (e.target.id === "t-cat") { TM.cat = e.target.value; return render(); }
    if (e.target.id === "t-cfilter") { TM.cfilter = e.target.value; saveTm(); return render(); }
    if (e.target.id === "t-per") { TM.perTopic = Number(e.target.value) || 6; return render(); }
    if (e.target.id === "p-files") { const files = [...e.target.files]; e.target.value = ""; if (files.length) addFormFiles(files); return; }
    if (e.target.id === "p-url") { const u = e.target.value.trim(); if (safeUrl(u) && u !== pform.lastUrl) draftPartner(false); return; }
    if (subChange(e.target)) return;
    if (e.target.id === "ao-file") { const f = e.target.files[0]; e.target.value = ""; if (f) addOppFromFile(f); return; }
    if (e.target.id === "fd-files") { const files = [...e.target.files]; e.target.value = ""; if (files.length) uploadForgeDocs(files); return; }
    if (e.target.id === "fd-type") { fdoc.type = e.target.value; return; }
    if (e.target.id === "st-files") { const files = [...e.target.files]; e.target.value = ""; if (files.length) addStaffFormFiles(files); return; }
    if (e.target.dataset?.stupload) { const files = [...e.target.files]; e.target.value = ""; if (files.length) uploadStaffDocs(e.target.dataset.stupload, files); return; }
    if (e.target.id === "st-tag") { sform.tag = e.target.value; return render(); }
    if (e.target.dataset?.upload) { const files = [...e.target.files]; e.target.value = ""; if (files.length) uploadDocs(e.target.dataset.upload, files); }
  });

  app.addEventListener("dragstart", (e) => {
    const card = e.target.closest?.(".card[data-card]"); if (!card) return;
    dragId = card.dataset.card; card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch {}
  });
  app.addEventListener("dragend", (e) => {
    e.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".over").forEach((x) => x.classList.remove("over")); dragId = null;
    if (heldRender) { heldRender = false; softRender(); }
  });
  app.addEventListener("dragover", (e) => {
    const zone = dragId && e.target.closest?.("[data-col]"); if (!zone) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".over").forEach((x) => x !== zone && x.classList.remove("over"));
    zone.classList.add("over");
  });
  app.addEventListener("dragleave", (e) => { const zone = e.target.closest?.("[data-col]"); if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("over"); });
  app.addEventListener("drop", (e) => {
    const zone = e.target.closest?.("[data-col]"); if (!zone || !dragId) return;
    e.preventDefault(); zone.classList.remove("over");
    const id = dragId; dragId = null; heldRender = false;
    moveCard(id, zone.dataset.col);
  });
  let typing;
  app.addEventListener("input", (e) => {
    if (e.target.closest("#decision, .form")) dirty = true;
    if (e.target.id === "p-summary") { pform.edited.summary = true; pform.summary = e.target.value; }
    if (e.target.id === "p-focus") { pform.edited.focus = true; pform.focus = e.target.value; }
  });
  app.addEventListener("input", async (e) => {
    if (subInput(e.target)) return;
    if (e.target.id === "st-q") {
      sform.q = e.target.value; clearTimeout(typing);
      typing = setTimeout(() => { const tmp = document.createElement("div"); tmp.innerHTML = staffHtml(); document.getElementById("stafflist")?.replaceWith(tmp.querySelector("#stafflist") || document.createElement("div")); const n = document.querySelector("#stfilters .note"), m = tmp.querySelector("#stfilters .note"); if (n && m) n.textContent = m.textContent; }, 120);
      return;
    }
    if (e.target.id === "d-psearch") {
      const q = e.target.value.trim().toLowerCase(), list = document.getElementById("d-presults");
      const cons = sorted(S.consortia).filter((c) => !dPartners.cons.includes(c.id) && (!q || [c.name, ...consMembers(c).map(partnerLabel)].join(" ").toLowerCase().includes(q))).slice(0, 5);
      const found = sorted(S.partners).filter((p) => !dPartners.list.includes(p.id) && (!q || [p.name, p.type, ...(p.focus || []), S.partners[p.parentId]?.name, p.startup ? "startup" : ""].join(" ").toLowerCase().includes(q))).slice(0, 10);
      list.innerHTML = [...cons.map((c) => `<li><button type="button" data-cpick="${esc(c.id)}"><b>Consortium:</b> ${esc(c.name)} <span class="note">${consSize(c)} members${c.lead === FORGE_ID ? " · Forge leads" : ""}</span></button></li>`),
        ...found.map((p) => `<li><button type="button" data-ppick="${esc(p.id)}">${esc(partnerLabel(p.id))} <span class="note">${esc(p.type || "")}${p.startup ? " · startup" : ""}</span></button></li>`)].join("") || `<li class="help" style="padding:6px">No matching partners. Add them on the Partners tab.</li>`;
      list.hidden = false;
      return;
    }
    if (e.target.id === "d-osearch") {
      const list = document.getElementById("d-oresults");
      const found = await user.search(e.target.value);
      found.forEach((p) => { names[p.id] = p.name; avatars[p.id] = p.avatarUrl; });
      list.innerHTML = found.filter((p) => !dOwners.list.includes(p.id)).slice(0, 8).map((p) => `<li><button type="button" data-opick="${esc(p.id)}"><img src="${esc(p.avatarUrl)}" alt="">${esc(p.name)}${p.guest ? ' <span class="note">guest</span>' : ""}</button></li>`).join("") || `<li class="help" style="padding:6px">No matches.</li>`;
      list.hidden = false;
      return;
    }
    if (e.target.id === "c-search") {
      const list = document.getElementById("c-results");
      const found = await user.search(e.target.value);
      found.forEach((p) => { names[p.id] = p.name; avatars[p.id] = p.avatarUrl; });
      list.innerHTML = found.slice(0, 8).map((p) => `<li><button type="button" data-pick="${esc(p.id)}"><img src="${esc(p.avatarUrl)}" alt="">${esc(p.name)}${p.guest ? ' <span class="note">guest</span>' : ""}</button></li>`).join("") || `<li class="help" style="padding:6px">No matches.</li>`;
      list.hidden = false;
      return;
    }
    if (e.target.closest?.("#sfilters")) {
      sf[{ "sf-q": "q", "sf-cat": "cat", "sf-api": "api", "sf-status": "status" }[e.target.id]] = e.target.value;
      clearTimeout(typing);
      typing = setTimeout(() => { const html = viewSources(); const tmp = document.createElement("div"); tmp.innerHTML = html;
        document.getElementById("src-list").replaceWith(tmp.querySelector("#src-list")); document.getElementById("sf-count").textContent = tmp.querySelector("#sf-count").textContent; }, 120);
      return;
    }
    if (e.target.id === "cs-q") { const q = e.target.value.trim().toLowerCase(); cform.q = q; document.querySelectorAll("#cs-list li[data-filter]").forEach((li) => { li.hidden = Boolean(q) && !li.dataset.filter.includes(q); }); return; }
    if (e.target.id === "tp-q" || e.target.id === "ts-q") {
      const q = e.target.value.trim().toLowerCase(); TM[e.target.id === "tp-q" ? "pq" : "sq"] = q;
      e.target.parentElement.querySelectorAll("li[data-filter]").forEach((li) => { li.hidden = Boolean(q) && !li.dataset.filter.includes(q); });
      return;
    }
    if (e.target.closest?.("#pfilters")) {
      const k = { "pf-q": "q", "pf-type": "type", "pf-stars": "stars", "pf-basis": "basis", "pf-unrated": "unrated", "pf-matches": "matches", "pf-focus": "focus", "pf-startup": "startup" }[e.target.id];
      if (k) pf[k] = k === "unrated" || k === "matches" || k === "startup" ? e.target.checked : e.target.value;
      savePf(); clearTimeout(typing);
      if (e.target.id !== "pf-q") return render();
      typing = setTimeout(() => { const tmp = document.createElement("div"); tmp.innerHTML = viewPartners();
        document.getElementById("plist")?.replaceWith(tmp.querySelector("#plist")); const n = document.querySelector("#pfilters .note"), m = tmp.querySelector("#pfilters .note"); if (n && m) n.textContent = m.textContent; }, 120);
      return;
    }
    if (e.target.id === "h-kind" || e.target.id === "h-who") { hf[e.target.id === "h-kind" ? "kind" : "who"] = e.target.value; return render(); }
    if (!e.target.closest("#filters")) return;
    if (e.target.id === "f-sort") { ui.sort = e.target.value; ui.sortDir = ""; saveFilters(); return redrawResults(); }
    const map = { "f-q": "q", "f-min": "min", "f-agency": "agency", "f-stage": "stage", "f-cat": "cat", "f-role": "role", "f-mech": "mech", "f-stars": "stars", "f-basis": "starBasis", "f-sort": "sort", "f-psort": "psort", "f-owner": "owner", "f-tc": "tc" };
    if (map[e.target.id]) ui[map[e.target.id]] = e.target.value;
    if (e.target.id === "f-clean") ui.clean = e.target.checked;
    if (e.target.id === "f-closed") ui.closed = e.target.checked;
    if (e.target.id === "f-partner") ui.partner = e.target.checked;
    if (e.target.id === "f-unrated") ui.unrated = e.target.checked;
    saveFilters();
    clearTimeout(typing);
    typing = setTimeout(() => {
      if (route() === "pipeline") return refreshBoard();
      const items = filtered(); document.getElementById("results").innerHTML = resultsHtml(items); document.querySelector(".head .sub .num").textContent = items.length;
    }, 120);
  });
  app.addEventListener("focusin", async (e) => { if (e.target.id === "d-psearch") { e.target.dispatchEvent(new Event("input", { bubbles: true })); return; } if (e.target.id === "d-osearch" && user?.search) { e.target.dispatchEvent(new Event("input", { bubbles: true })); return; } if (e.target.id === "c-search" && user?.search) { const found = await user.search(""); found.forEach((p) => { names[p.id] = p.name; avatars[p.id] = p.avatarUrl; }); } });

  // ---------- people ----------
  async function resolveNames() {
    if (!user?.profiles) return;
    const ids = new Set();
    Object.values(S.decisions).forEach((d) => { if (d.updatedBy) ids.add(d.updatedBy); (d.owners || []).forEach((x) => ids.add(x)); });
    Object.values(S.history).forEach((h) => h.by && ids.add(h.by));
    Object.keys(S.ratings).forEach((uid) => ids.add(uid));
    if (S.profile.main?.updatedBy) ids.add(S.profile.main.updatedBy);
    if (S.settings.scanRequest?.requestedBy) ids.add(S.settings.scanRequest.requestedBy);
    Object.values(S.categories).forEach((c) => (c.members || []).forEach((m) => ids.add(m)));
    Object.values(draftMembers).forEach((l) => l.forEach((m) => ids.add(m)));
    if (me) ids.add(me);
    if (!ids.size) return;
    try {
      const ps = await user.profiles([...ids]);
      let changed = false;
      for (const id of ids) { const p = ps[id]; if (!p) continue; if (names[id] !== p.name || avatars[id] !== p.avatarUrl) changed = true; names[id] = p.name; avatars[id] = p.avatarUrl; }
      if (changed) softRender();
    } catch {}
  }

  // ---------- store connection ----------
  async function connect() {
    const timer = setTimeout(() => { if (storeState === "connecting") { storeState = "offline"; softRender(); } }, 10000);
    try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch { db = null; }
    if (!db) { clearTimeout(timer); storeState = "offline"; softRender(); return; }
    canWrite = user?.can ? user.can("data.write") !== false : true;
    try { me = (await user?.id?.()) || null; } catch { me = null; }
    let pending = Object.keys(S).length;
    for (const coll of Object.keys(S)) {
      const q = coll === "history" ? db.collection("history").orderBy("at", "desc").limit(500) : db.collection(coll);
      q.onSnapshot((snap) => {
        const next = {}; snap.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
        S[coll] = next;
        if (coll === "proposals" || coll === "manual") mergeProposals();
        if (pending > 0 && --pending === 0) clearTimeout(timer);
        storeState = "ready"; softRender(); resolveNames();
      }, () => { clearTimeout(timer); if (storeState !== "ready") storeState = "offline"; softRender(); });
    }
  }

  Promise.all([fetch("opportunities.json").then((r) => r.json()), fetch("meta.json").then((r) => r.json())])
    .then(([opps, meta]) => { BASE_OPPS = opps; OPPS = opps; META = meta; render(); connect(); })
    .catch((e) => { console.error(e); app.innerHTML = `<p class="panel empty">The opportunity data didn't load. Reload the page to try again.</p>`; });
})();
</script>
